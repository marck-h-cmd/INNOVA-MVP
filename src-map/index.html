<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNT Campus 3D - Universidad Nacional de Trujillo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }

    /* UI Overlay */
    #ui-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      color: #fff;
    }
    #ui-overlay h1 {
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      margin-bottom: 8px;
    }
    #ui-overlay .subtitle {
      font-size: 12px;
      opacity: 0.7;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* Controls panel */
    #controls-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(20, 20, 40, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      color: #fff;
      min-width: 200px;
    }
    #controls-panel h3 {
      font-size: 13px;
      margin-bottom: 12px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .control-row label { opacity: 0.7; }
    .toggle-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .toggle-btn:hover { background: rgba(255,255,255,0.2); }
    .toggle-btn.active { background: rgba(76, 175, 80, 0.5); border-color: #4CAF50; }

    /* Tooltip */
    #tooltip {
      position: fixed;
      padding: 8px 14px;
      background: rgba(20, 20, 40, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      pointer-events: none;
      display: none;
      z-index: 200;
      max-width: 250px;
    }
    #tooltip .tt-name { font-weight: 600; margin-bottom: 2px; }
    #tooltip .tt-type { font-size: 11px; opacity: 0.6; }

    /* Legend */
    #legend {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(20, 20, 40, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff;
    }
    #legend h4 { font-size: 12px; opacity: 0.6; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Compass */
    #compass {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      width: 70px;
      height: 70px;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <h1>🏛️ Campus UNT - Mapa 3D</h1>
    <div class="subtitle">Universidad Nacional de Trujillo</div>
  </div>

  <div id="controls-panel">
    <h3>Controles</h3>
    <div class="control-row">
      <label>Edificios</label>
      <button class="toggle-btn active" data-layer="buildings">Visible</button>
    </div>
    <div class="control-row">
      <label>Zonas Verdes</label>
      <button class="toggle-btn active" data-layer="greenAreas">Visible</button>
    </div>
    <div class="control-row">
      <label>Árboles</label>
      <button class="toggle-btn active" data-layer="trees">Visible</button>
    </div>
    <div class="control-row">
      <label>Caminos</label>
      <button class="toggle-btn active" data-layer="paths">Visible</button>
    </div>
    <div class="control-row">
      <label>Etiquetas</label>
      <button class="toggle-btn active" data-layer="labels">Visible</button>
    </div>
    <hr style="border-color: rgba(255,255,255,0.1); margin: 10px 0;">
    <div class="control-row">
      <label>Hora del día</label>
      <input type="range" id="time-slider" min="0" max="24" step="0.5" value="10" style="width: 90px;">
    </div>
    <div class="control-row">
      <label></label>
      <span id="time-display" style="font-size: 12px; opacity: 0.6;">10:00</span>
    </div>
  </div>

  <div id="tooltip">
    <div class="tt-name"></div>
    <div class="tt-type"></div>
  </div>

  <div id="legend">
    <h4>Leyenda</h4>
    <div class="legend-item"><div class="legend-color" style="background: #b0bec5;"></div> Edificios académicos</div>
    <div class="legend-item"><div class="legend-color" style="background: #ef5350;"></div> Edificios administrativos</div>
    <div class="legend-item"><div class="legend-color" style="background: #66bb6a;"></div> Zonas verdes / Parques</div>
    <div class="legend-item"><div class="legend-color" style="background: #2e7d32;"></div> Árboles</div>
    <div class="legend-item"><div class="legend-color" style="background: #e0e0e0;"></div> Caminos / Vías</div>
    <div class="legend-item"><div class="legend-color" style="background: #ff7043;"></div> Deportivo / Estadio</div>
  </div>

  <canvas id="compass"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
